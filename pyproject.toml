[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redforge"
dynamic = ["version"]
description = "AI-RedForge: Agentic AI Red-Team Factory — blueprint Tier-1 demo implementation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.22",
    "jinja2>=3.1",
    "reportlab>=5.0",
    "fastmcp>=4.0",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "playwright>=1.49", "pillow>=11.0"]

[tool.setuptools.packages.find]
include = ["redforge*"]

[tool.setuptools.dynamic]
version = {attr = "redforge.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "optional_pyrit: requires the optional PyRIT package",
    "optional_opa: requires the OPA binary at RF_OPA_PATH",
    "live_astra: calls paid Azure Astra (opt-in via RF_LIVE_ASTRA=1 only)",
    "conformance: attacks a real external target (opt-in via RF_CONFORMANCE_BASE_URL)",
]
# The release suite stays hermetic: conformance tests reach a third-party
# endpoint, so they never run as part of a plain `pytest` or a gate.
addopts = "-m 'not conformance'"
