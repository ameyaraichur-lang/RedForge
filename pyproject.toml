[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redforge"
version = "0.1.0"
description = "AI-RedForge: Agentic AI Red-Team Factory — blueprint Tier-1 demo implementation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.22",
    "jinja2>=3.1",
    "reportlab>=5.0",
    "fastmcp>=4.0",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["redforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
